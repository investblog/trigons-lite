<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrigonsLite — animated triangulated backgrounds</title>
<meta name="description" content="Lightweight animated triangulated backgrounds for the web. Two render modes, static SVG pattern, zero dependencies, ~3KB gzip.">
<meta property="og:title" content="TrigonsLite — animated triangulated backgrounds">
<meta property="og:description" content="Low-poly canvas backgrounds with entrance animations, a line-art sweep mode and a static SVG pattern. Zero dependencies, ~3KB gzip.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://investblog.github.io/trigons-lite/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpolygon points='8,2 15,14 1,14' fill='%238e7cff'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e0e0f0; }

/* ── Controls ─────────────────────────── */
.controls {
	position: fixed; top: 0; left: 0; right: 0; z-index: 10;
	display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
	padding: 12px 20px;
	background: rgba(10,10,15,0.92); backdrop-filter: blur(10px);
	border-bottom: 1px solid rgba(142,124,255,0.2);
	font-size: 13px;
}
.controls label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.controls select, .controls input[type=range] {
	background: #1a1a24; color: #e0e0f0; border: 1px solid #333; border-radius: 4px;
	padding: 4px 8px; font-size: 13px;
}
.controls select { cursor: pointer; }
.controls input[type=range] { width: 90px; padding: 0; }
.controls button {
	padding: 6px 18px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600;
	cursor: pointer; transition: 0.15s;
}
.btn-in { background: #8e7cff; color: #0a0a0f; }
.btn-in:hover { background: #a594ff; }
.btn-out { background: #ff66cc; color: #0a0a0f; }
.btn-out:hover { background: #ff88dd; }
.btn-regen { background: #333; color: #ccc; }
.btn-regen:hover { background: #444; }
.val { color: #8e7cff; font-weight: 600; min-width: 32px; display: inline-block; }
.group { display: flex; flex-direction: column; gap: 2px; }

/* ── Brand / links ────────────────────── */
.brand {
	display: flex; align-items: center; gap: 8px;
	font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: #e0e0f0;
	text-decoration: none; margin-right: 8px;
}
.brand svg { width: 18px; height: 18px; color: #8e7cff; }
.links { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.links a {
	display: inline-flex; align-items: center; gap: 6px;
	color: #888; text-decoration: none; font-size: 13px; transition: 0.15s;
}
.links a:hover { color: #e0e0f0; }
.links svg { width: 16px; height: 16px; }
.links .logo301 svg { width: 20px; height: 20px; }

/* ── Canvas area ──────────────────────── */
.stage {
	position: fixed; inset: 0; z-index: 0;
}

/* ── Pattern swatches ─────────────────── */
.patterns {
	position: fixed; bottom: 56px; left: 0; right: 0; z-index: 10;
	display: flex; align-items: center; gap: 10px;
	padding: 8px 20px;
	background: rgba(10,10,15,0.85); backdrop-filter: blur(10px);
	border-top: 1px solid rgba(142,124,255,0.1);
	font-size: 11px; color: #888;
}
.patterns code { color: #8e7cff; font-size: 11px; }
.patterns .sw {
	width: 96px; height: 32px; border: 1px solid #2a2a35; border-radius: 4px;
	background-color: #0a0a0f;
}

/* ── Theme badges ─────────────────────── */
.themes {
	position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
	display: flex; gap: 0;
	background: rgba(10,10,15,0.92); backdrop-filter: blur(10px);
	border-top: 1px solid rgba(142,124,255,0.15);
}
.themes button {
	flex: 1; padding: 10px 8px; border: none; background: transparent;
	color: #888; font-size: 11px; cursor: pointer; transition: 0.15s;
	border-top: 2px solid transparent;
}
.themes button:hover { color: #e0e0f0; background: rgba(255,255,255,0.03); }
.themes button.active { color: #8e7cff; border-top-color: #8e7cff; }
</style>
</head>
<body>

<div class="controls">
	<a class="brand" href="#">
		<svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 15,14.5 1,14.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
		trigons
	</a>
	<div class="group">
		<label>Mode</label>
		<select id="mode">
			<option value="fill" selected>fill</option>
			<option value="lines">lines</option>
		</select>
	</div>
	<div class="group">
		<label>Effect</label>
		<select id="fx">
			<option value="fade">fade</option>
			<option value="scale" selected>scale</option>
			<option value="spin">spin</option>
			<option value="fly">fly</option>
		</select>
	</div>
	<div class="group">
		<label>Direction</label>
		<select id="dir">
			<option value="top" selected>top</option>
			<option value="bottom">bottom</option>
			<option value="left">left</option>
			<option value="right">right</option>
			<option value="center">center</option>
			<option value="random">random</option>
		</select>
	</div>
	<div class="group">
		<label>Duration</label>
		<div><input type="range" id="dur" min="300" max="5000" value="1800" step="100"><span class="val" id="durVal">1800</span></div>
	</div>
	<div class="group">
		<label>Stagger</label>
		<div><input type="range" id="stag" min="0" max="0.9" value="0.6" step="0.05"><span class="val" id="stagVal">0.6</span></div>
	</div>
	<div class="group">
		<label>Easing</label>
		<select id="easing">
			<option value="ease-out" selected>ease-out</option>
			<option value="ease-in">ease-in</option>
			<option value="ease-in-out">ease-in-out</option>
			<option value="linear">linear</option>
		</select>
	</div>
	<div class="group">
		<label>Size</label>
		<div>
			<label style="font-size:12px;color:#e0e0f0;cursor:pointer"><input type="checkbox" id="sizeAuto" checked> auto</label>
			<input type="range" id="size" min="40" max="320" value="200" step="10" disabled>
			<span class="val" id="sizeVal">auto</span>
		</div>
	</div>
	<div class="group">
		<label>Depth</label>
		<div><input type="range" id="depth" min="0" max="0.8" value="0.4" step="0.05"><span class="val" id="depthVal">0.4</span></div>
	</div>
	<div class="group">
		<label>Sweep</label>
		<div><input type="range" id="sweep" min="0" max="3" value="1" step="0.1"><span class="val" id="sweepVal">1</span></div>
	</div>
	<button class="btn-in" id="btnIn">Animate In</button>
	<button class="btn-out" id="btnOut">Animate Out</button>
	<button class="btn-regen" id="btnRegen">Regenerate</button>
	<div class="links">
		<a href="https://github.com/investblog/trigons-lite" target="_blank" rel="noopener noreferrer">
			<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg><span>GitHub</span>
		</a>
		<a class="logo301" href="https://301.st" target="_blank" rel="noopener noreferrer" title="Made in 301">
			<svg viewBox="0 0 26 26" fill="currentColor" aria-hidden="true"><path d="M13.295 18.57c-.013 1.026-.074 2.047-.438 3.026-.681 1.828-2.003 2.903-3.893 3.284a8.3 8.3 0 0 1-1.56.146c-2.42.024-4.839.025-7.259.034H0v-5.454h.214c2.22.01 4.442.017 6.662.003a4 4 0 0 0 1.058-.16 1.66 1.66 0 0 0 1.22-1.546c.034-.746.052-1.494.031-2.24-.028-1.03-.769-1.766-1.8-1.803-.854-.03-1.71-.032-2.565-.035-1.536-.005-3.072 0-4.607-.008H0V9.5h.196c2.104 0 4.208.005 6.313-.007.307-.002.628-.053.917-.154.608-.212.98-.81.986-1.5q.003-.573 0-1.146c-.002-.878-.595-1.475-1.467-1.475H.034V.936h.172C3.289.947 6.37.943 9.454.95c.638.001 1.283.03 1.86.35.68.38 1.116.956 1.157 1.743.049.917.039 1.837.04 2.755.001.645-.004 1.29-.036 1.934-.045.886-.27 1.72-.849 2.42-.472.573-1.058.98-1.794 1.146-.01.002-.016.014-.041.036.089.018.167.031.243.05 1.595.404 2.635 1.372 2.984 3.001.128.598.203 1.213.24 1.824.047.785.048 1.574.037 2.361m8.421.051c-.002 1.014-.14 2.011-.596 2.933-.86 1.734-2.254 2.807-4.108 3.298-.848.224-1.712.225-2.59.2v-4.084c.265-.02.528-.026.788-.058 1.106-.136 1.82-.776 2.238-1.78.278-.667.396-1.375.41-2.089.04-1.84.053-3.68.064-5.52a60 60 0 0 0-.035-2.542c-.03-.8-.128-1.591-.436-2.343-.431-1.049-1.256-1.616-2.387-1.628-.429-.005-.857-.001-1.293-.001V.955c.018-.007.033-.018.048-.018.776.01 1.556-.023 2.327.043a5.94 5.94 0 0 1 3.612 1.601 5.94 5.94 0 0 1 1.857 3.404c.066.379.104.767.104 1.151q.01 5.869-.003 11.738zM26 .96v24.087q-.08.008-.152.01-1.155.003-2.312 0-.145 0-.286-.033a.38.38 0 0 1-.31-.325c-.017-.112-.016-.227-.016-.341q.002-11.388-.006-22.775c0-.44.185-.619.62-.621q.94-.004 1.883-.002z"/></svg>
		</a>
	</div>
</div>

<div class="stage" id="stage"></div>

<div class="patterns">
	<code>TrigonsLite.pattern()</code>
	<div class="sw" id="sw1" title="size: 16"></div>
	<div class="sw" id="sw2" title="size: 24"></div>
	<div class="sw" id="sw3" title="size: 40, weight: 1.5"></div>
	<span>static SVG tile — no canvas</span>
</div>

<div class="themes" id="themes">
	<button class="active" data-theme="dark-subtle">Dark<br>Subtle</button>
	<button data-theme="dark-brand">Dark<br>Brand glow</button>
	<button data-theme="dark-purple">Dark<br>Purple</button>
	<button data-theme="dark-gradient">Dark<br>Gold→Purple</button>
	<button data-theme="dark-neon">Dark<br>Neon pink</button>
	<button data-theme="light-subtle">Light<br>Subtle</button>
	<button data-theme="light-brand">Light<br>Brand red</button>
	<button data-theme="light-purple">Light<br>Purple</button>
</div>

<script src="trigons-lite.js"></script>
<script>
var themes = {
	'dark-subtle':   { colors: ['#0a0a0f', '#1a1a24', '#3c3c4b'], lineColors: ['#2a2a3c', '#4a4a68', '#8e7cff'], bg: '#0a0a0f', hot: '#e4e9ff', accent: '#8e7cff' },
	'dark-brand':    { colors: ['#0a0a0f', '#1a1a24', '#fcb01d'], lineColors: ['#3c3220', '#8a6a1a', '#fcb01d'], bg: '#0a0a0f', hot: '#ffe9b8', accent: '#fcb01d' },
	'dark-purple':   { colors: ['#12121a', '#3c3c4b', '#8e7cff'], lineColors: ['#2c2c44', '#5c50a8', '#a594ff'], bg: '#12121a', hot: '#e4e0ff', accent: '#8e7cff' },
	'dark-gradient': { colors: ['#0a0a0f', '#fcb01d', '#8e7cff'], lineColors: ['#3a2f16', '#fcb01d', '#8e7cff'], bg: '#0a0a0f', hot: '#fff3d6', accent: '#fcb01d' },
	'dark-neon':     { colors: ['#1a1a24', '#8e7cff', '#ff66cc'], lineColors: ['#3c2c44', '#8e7cff', '#ff66cc'], bg: '#1a1a24', hot: '#ffd6ef', accent: '#ff66cc' },
	'light-subtle':  { colors: ['#ffffff', '#f3f5f6', '#d6d6d6'], lineColors: ['#d0d0d8', '#a0a0b8', '#8e7cff'], bg: '#ffffff', hot: '#8e7cff', accent: '#8e7cff' },
	'light-brand':   { colors: ['#f3f5f6', '#fafafa', '#ebd2d4'], lineColors: ['#e0c8ca', '#c98f94', '#c0392b'], bg: '#f3f5f6', hot: '#c0392b', accent: '#c0392b' },
	'light-purple':  { colors: ['#fafafa', '#f3f5f6', '#e4e0f5'], lineColors: ['#d8d2ee', '#b0a4e0', '#8e7cff'], bg: '#fafafa', hot: '#8e7cff', accent: '#8e7cff' }
};

var current = 'dark-subtle';
var tg = null;

var sizeAuto = document.getElementById('sizeAuto');
var sizeSlider = document.getElementById('size');
var sizeVal = document.getElementById('sizeVal');

sizeAuto.addEventListener('change', function() {
	sizeSlider.disabled = sizeAuto.checked;
	sizeVal.textContent = sizeAuto.checked ? 'auto' : sizeSlider.value;
});

function getOpts() {
	var s = sizeAuto.checked ? 'auto' : +sizeSlider.value;
	var mode = document.getElementById('mode').value;
	return {
		mode: mode,
		colors: mode === 'lines' ? themes[current].lineColors : themes[current].colors,
		hot: themes[current].hot,
		sweep: +document.getElementById('sweep').value,
		size: s,
		chaos: 0.65,
		depth: +document.getElementById('depth').value,
		startVisible: false
	};
}

function getAnimOpts() {
	return {
		effect: document.getElementById('fx').value,
		direction: document.getElementById('dir').value,
		duration: +document.getElementById('dur').value,
		stagger: +document.getElementById('stag').value,
		easing: document.getElementById('easing').value
	};
}

function updatePatterns() {
	var accent = themes[current].accent;
	var op = current.indexOf('light') === 0 ? 0.25 : 0.35;
	document.getElementById('sw1').style.backgroundImage = TrigonsLite.pattern({ size: 16, color: accent, opacity: op });
	document.getElementById('sw2').style.backgroundImage = TrigonsLite.pattern({ size: 24, color: accent, opacity: op });
	document.getElementById('sw3').style.backgroundImage = TrigonsLite.pattern({ size: 40, color: accent, opacity: op, weight: 1.5 });
}

function rebuild() {
	document.body.style.background = themes[current].bg;
	document.body.style.color = current.indexOf('light') === 0 ? '#000' : '#e0e0f0';
	if (tg) tg.destroy();
	tg = TrigonsLite.init('#stage', getOpts());
	tg.animateIn(getAnimOpts());
	updatePatterns();
}

// range value displays
['dur','stag','depth','sweep'].forEach(function(id) {
	var el = document.getElementById(id);
	el.addEventListener('input', function() { document.getElementById(id + 'Val').textContent = el.value; });
});
sizeSlider.addEventListener('input', function() {
	if (!sizeAuto.checked) sizeVal.textContent = sizeSlider.value;
});

// mode switch rebuilds
document.getElementById('mode').addEventListener('change', rebuild);
document.getElementById('sweep').addEventListener('change', rebuild);

// buttons
document.getElementById('btnIn').addEventListener('click', function() { tg.animateIn(getAnimOpts()); });
document.getElementById('btnOut').addEventListener('click', function() { tg.animateOut(getAnimOpts()); });
document.getElementById('btnRegen').addEventListener('click', rebuild);

// theme switcher
document.getElementById('themes').addEventListener('click', function(e) {
	var btn = e.target.closest('[data-theme]');
	if (!btn) return;
	document.querySelectorAll('.themes button').forEach(function(b) { b.classList.remove('active'); });
	btn.classList.add('active');
	current = btn.dataset.theme;
	rebuild();
});

// init
rebuild();
</script>
</body>
</html>
