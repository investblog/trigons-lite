name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Budget is a gate, not a report — see docs/decisions/003 (3.25 KB = 3328 B)
      - name: Size gate (min+gzip <= 3328 B)
        run: |
          echo "minified: $(wc -c < trigons-lite.min.js) B"
          SIZE=$(gzip -9 -c trigons-lite.min.js | wc -c)
          echo "gzipped:  $SIZE B (budget 3328)"
          if [ "$SIZE" -gt 3328 ]; then
            echo "::error::gzipped size $SIZE B exceeds the 3328 B budget (docs/decisions/003)"
            exit 1
          fi
